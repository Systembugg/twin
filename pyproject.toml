[project]
name = "twin-harness"
version = "0.1.0"
description = "Multi-tenant agentic harness for a digital-twin assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "pyjwt[crypto]>=2.8.0",
]

[project.optional-dependencies]
# Everything needed to run the multi-tenant deployment (API + workers).
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]
# Groq, vLLM, Ollama, OpenRouter, Together — all one protocol, one client.
openai = [
    "openai>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
twin = "twin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twin*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
